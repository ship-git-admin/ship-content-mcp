name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: php -l
        run: find ship-content-mcp tests -name '*.php' -print0 | xargs -0 -n1 php -l

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: gd, exif, sodium, fileinfo
          tools: none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install jsonschema==4.23.0
      - name: contracts (schema check)
        run: python3 -c "import json,glob,jsonschema; [jsonschema.Draft202012Validator.check_schema(json.load(open(f))) for f in glob.glob('contracts/*.json')]; print('contracts ok')"
      - name: local tests (PHP, ACF, media, policy, bridge)
        run: tools/test.sh

  bridge-node18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: sodium
          tools: none
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: bridge tests on Node 18
        run: node --test tests/node/bridge.test.mjs

  secrets-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: secret scan
        run: python3 tools/secret_scan.py
      - name: secret scan (history)
        run: python3 tools/secret_scan.py --history
      - name: build and inspect ZIP (rehearsal version, not distributed)
        run: python3 tools/build_release.py --rehearsal-version 0.0.0
